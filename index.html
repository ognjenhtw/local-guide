<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Local</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main>
      <h1>Local</h1>

      <section id="profile-section">
        <label class="row">Who's walking?
          <input id="profile-input" list="profile-list" placeholder="Your name" autocomplete="off" />
          <datalist id="profile-list"></datalist>
        </label>
        <p id="profile-info" class="muted"></p>
      </section>

      <section id="search-section">
        <form id="search-form">
          <input id="search-input" type="search" placeholder="Where do you want to go?" autocomplete="off" />
          <button type="submit">Search</button>
        </form>
        <ul id="results"></ul>
      </section>

      <section id="route-section" hidden>
        <h2 id="route-title"></h2>
        <p id="route-summary" class="muted"></p>
        <button id="start-btn" type="button">Start walking</button>
        <ol id="turns"></ol>
      </section>

      <section id="walk-section" hidden>
        <p id="phase" class="phase"></p>
        <p id="nav-status" class="muted"></p>
        <div class="buttons">
          <button id="back-btn" type="button">Head back</button>
          <button id="stop-btn" type="button" class="danger">Stop</button>
        </div>
        <div id="transcript"></div>
      </section>

      <details id="settings">
        <summary>Settings</summary>
        <label class="row">Voice AI <select id="provider"></select></label>
        <label class="row">Model <select id="model"></select></label>
        <label class="row">Voice <select id="voice"></select></label>
        <label class="check"><input id="search" type="checkbox" /> Look up facts online (Gemini, paid tier only)</label>
        <label class="row">Gemini API key <input id="key-gemini" type="password" autocomplete="off" /></label>
        <label class="row">OpenAI API key <input id="key-openai" type="password" autocomplete="off" /></label>
        <button id="export-btn" type="button" class="secondary">Export walk logs</button>
      </details>

      <details id="debug">
        <summary>Log</summary>
        <pre id="log"></pre>
      </details>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
